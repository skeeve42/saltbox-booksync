---
name: Role tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  books-rclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          python3 -m venv .venv
          .venv/bin/pip install 'ansible-lint==26.8.0'
      - name: Run offline role integration tests
        run: PATH="$PWD/.venv/bin:$PATH" python3 -m unittest discover -s tests -v
